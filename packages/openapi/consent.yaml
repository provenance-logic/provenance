openapi: 3.1.0
info:
  title: Provenance Consent API
  version: 0.1.0
  description: |
    Connection references (Domain 12 — per-use-case consent).

    A connection reference is a first-class, owned, revocable authorization
    record pairing an agent's access to a product with an explicit
    human-consented use-case declaration. It composes with, but does not
    replace, the access grant (ADR-005): both must be in an active state for
    an agent action to be authorized.

servers:
  - url: /api/v1

tags:
  - name: ConnectionReferences
    description: Per-use-case consent for agent consumption of data products
  - name: ConnectionReferencesInternal
    description: |
      Internal endpoints the Agent Query Layer calls for connection-reference
      cache cold-load and cache-miss fallback (ADR-006). Service-token
      authenticated, NOT user-JWT authenticated. Not for end-user consumption.

paths:
  /organizations/{orgId}/consent/connection-references:
    parameters:
      - $ref: '#/components/parameters/orgId'

    get:
      operationId: listConnectionReferences
      summary: List connection references
      tags: [ConnectionReferences]
      description: |
        Returns a paginated list of connection references in the caller's
        organization. Supports filtering by agent, product, owning principal,
        and state.
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: owningPrincipalId
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/ConnectionReferenceState'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Paginated list of connection references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReferenceList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      operationId: requestConnectionReference
      summary: Submit a new connection reference request
      tags: [ConnectionReferences]
      description: |
        Opens a new connection reference request against a product the
        calling agent already holds an active access grant for (F12.9).

        Trust-classification gating:
          * Observed agents — the request must be submitted by a human
            proxy on the agent's behalf; self-submit is rejected.
          * Supervised and Autonomous agents — may submit on their own
            behalf.

        Validation:
          * agentId, productId must exist in the caller's organization.
          * An active access grant must exist for (agentId, productId).
          * purposeElaboration must be at least 50 characters.
          * requestedDurationDays must be a positive integer.

        The reference is created in `pending` state and must be approved
        by the product's owning principal before use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitConnectionReferenceRequest'
      responses:
        '201':
          description: Pending connection reference created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReference'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{orgId}/consent/connection-references/{referenceId}:
    parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/referenceId'

    get:
      operationId: getConnectionReference
      summary: Get a connection reference by ID
      tags: [ConnectionReferences]
      responses:
        '200':
          description: Connection reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReference'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{orgId}/consent/connection-references/{referenceId}/approve:
    parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/referenceId'

    post:
      operationId: approveConnectionReference
      summary: Approve a pending connection reference (F12.13)
      tags: [ConnectionReferences]
      description: |
        Transitions a pending reference to active. Only the reference's
        owning principal may approve. The body may optionally narrow the
        originally-requested scope, data category constraints, or duration
        (F12.7: narrow, never broaden). Duration may not exceed the
        originally requested duration.

        On activation the platform recomputes expires_at from the approved
        duration and marks `modifiedByApprover` true if any field was
        narrowed vs. the original request.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveConnectionReferenceOptions'
      responses:
        '200':
          description: Approved (now active) connection reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReference'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{orgId}/consent/connection-references/{referenceId}/deny:
    parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/referenceId'

    post:
      operationId: denyConnectionReference
      summary: Deny a pending connection reference (F12.12)
      tags: [ConnectionReferences]
      description: |
        Transitions a pending reference to revoked with an immutable
        denial record (denier, reason, timestamp). Only the owning
        principal may deny; the reason is required and non-empty.

        Use the revoke endpoint for active or suspended references.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DenyConnectionReferenceRequest'
      responses:
        '200':
          description: Denied (now revoked) connection reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReference'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{orgId}/consent/connection-references/{referenceId}/revoke:
    parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/referenceId'

    post:
      operationId: revokeConnectionReference
      summary: Revoke an active or suspended connection reference (F12.19)
      tags: [ConnectionReferences]
      description: |
        The owning principal may revoke an active or suspended connection
        reference at any time. Revocation is immediate and terminal. The
        reason is required and recorded in the audit log.

        Pending references cannot be revoked through this endpoint — use
        deny instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeConnectionReferenceRequest'
      responses:
        '200':
          description: Revoked connection reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReference'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/consent/connection-references/active:
    get:
      operationId: internalListActiveConnectionReferences
      summary: Cache cold-load — every active connection reference for an org
      tags: [ConnectionReferencesInternal]
      description: |
        Returns every connection reference in the `active` state for the
        given organization. Called by the Agent Query Layer at startup to
        populate its in-memory cache (ADR-006 § "Data Source"). Pending,
        suspended, expired, and revoked references are filtered out — only
        rows currently usable on the hot path are returned.

        Authentication is via the `x-internal-service-token` header,
        constant-time-compared to the API's `AQL_INTERNAL_TOKEN` config.
        User JWTs are not accepted on this endpoint.
      security:
        - internalServiceToken: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Items array of currently-active references
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectionReference'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/consent/legacy-agent-migration:
    post:
      operationId: internalRunLegacyAgentMigration
      summary: F12.25 legacy-agent migration (run once before flipping enforcement)
      tags: [ConnectionReferencesInternal]
      description: |
        Operator-invoked one-time migration. Provisions a
        legacy-compatibility connection reference for every existing
        active agent-product access grant pair that does not already
        have an active reference. Without this step, flipping
        `CONNECTION_REFERENCE_ENFORCEMENT_ENABLED=true` on the AQL
        would deny every existing agent on the next request.

        Provisioned references carry useCaseCategory
        "Legacy - Migration Required", scope `{ ports: ['*'] }`, a
        30-day expiry, and `causedBy: 'legacy_migration'`. The owning
        principal of each affected product is notified via the
        `connection_reference_legacy_provisioned` category.

        Idempotent: re-running provisions zero rows on the second
        pass. Per-grant failures are logged and the migration
        continues — the response reflects partial completion.

        Authentication is via the `x-internal-service-token` header.
      security:
        - internalServiceToken: []
      responses:
        '200':
          description: Migration complete
          content:
            application/json:
              schema:
                type: object
                required: [provisioned, skipped]
                properties:
                  provisioned:
                    type: integer
                    description: Number of legacy references created on this run.
                  skipped:
                    type: integer
                    description: |
                      Number of eligible grants that already had an
                      active reference and did not need provisioning.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/consent/scope-violations:
    post:
      operationId: internalNotifyScopeViolation
      summary: Fan out a scope-violation notification (owning principal + governance)
      tags: [ConnectionReferencesInternal]
      description: |
        Called by the Agent Query Layer when the connection-reference
        guard denies a request with
        `CONNECTION_REFERENCE_SCOPE_VIOLATION`. The API resolves
        recipients (the reference's owning principal + every principal
        carrying the `governance_member` role in the org) and enqueues
        a `connection_reference_scope_violation` notification.

        Fire-and-forget from the AQL's perspective — the audit-log
        entry the AQL already wrote is the durable record; this
        notification is the operator wake-up call. Runs regardless of
        whether enforcement is on (shadow-mode violations are still
        operator-visible per the "never silent" rule).

        Authentication is via the `x-internal-service-token` header.
      security:
        - internalServiceToken: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referenceId
                - agentId
                - productId
                - actionScope
                - approvedScope
                - enforcementMode
              properties:
                referenceId:
                  type: string
                  format: uuid
                agentId:
                  type: string
                  format: uuid
                productId:
                  type: string
                  format: uuid
                actionScope:
                  type: object
                  required: [port]
                  properties:
                    port:
                      type: string
                    dataCategories:
                      type: array
                      items:
                        type: string
                approvedScope:
                  $ref: '#/components/schemas/ConnectionReferenceScope'
                denyReason:
                  type: string
                enforcementMode:
                  type: string
                  enum: [shadow, enforced]
      responses:
        '204':
          description: Notification enqueued (or no-op when no recipients)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/consent/connection-references/active/lookup:
    get:
      operationId: internalLookupActiveConnectionReference
      summary: Cache-miss fallback — one active reference by (org, agent, product)
      tags: [ConnectionReferencesInternal]
      description: |
        Returns the active connection reference for a single
        (orgId, agentId, productId) triple, or 404 when none exists.
        Called by the Agent Query Layer's connection-reference guard
        when the in-memory cache misses for that triple (request landed
        before cold-load completed, or the entry was evicted).

        Only `active` references are returned. Pending, suspended,
        expired, and revoked references produce a 404 — they are not
        usable on the hot path.

        Authentication is via the `x-internal-service-token` header.
      security:
        - internalServiceToken: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: agentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The active connection reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReference'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    referenceId:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  securitySchemes:
    internalServiceToken:
      type: apiKey
      in: header
      name: x-internal-service-token
      description: |
        Shared secret between the API and internal callers (Agent Query
        Layer for Domain 12; future internal workers). Constant-time-
        compared to the API's `AQL_INTERNAL_TOKEN` config. Not for
        end-user use — the value is rotated by operators and never
        leaves trusted infrastructure.

  responses:
    BadRequest:
      description: Bad request — validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ConnectionReferenceState:
      type: string
      description: |
        Lifecycle states per F12.2. Expired and Revoked are terminal —
        no transition out of either is permitted.
      enum:
        - pending
        - active
        - suspended
        - expired
        - revoked

    ConnectionReferenceCause:
      type: string
      description: |
        Cause marker carried on the reference row and on the Redpanda
        event payload for the most recent state transition (ADR-007).
      enum:
        - principal_action
        - governance_action
        - automatic_expiration
        - major_version_suspension
        - grant_revocation_cascade
        - product_lifecycle_cascade
        - principal_lifecycle_cascade
        - legacy_migration

    ConnectionReferenceScope:
      type: object
      description: |
        Scope of an agent's intended or approved consumption of a product.
        MVP shape (locked 2026-05-08, see Domain 12 implementation plan
        Decision 1): names output ports only. Action-verb gating and
        field-level narrowing are deliberate future work — write tools
        land in Phase 6+, and category-level narrowing lives in
        DataCategoryConstraints. F12.16 enforcement matches against
        this shape.
      required:
        - ports
      properties:
        ports:
          type: array
          description: |
            List of output port names (not UUIDs). The wildcard `'*'`
            stands for all output ports of the product; approval UIs
            must render it as "all ports" so the principal sees what
            they consent to.
          minItems: 1
          items:
            type: string
            minLength: 1
      additionalProperties: false

    DataCategoryConstraints:
      type: object
      description: |
        Optional restriction to specific data categories within a product
        that carries fields of multiple sensitivity levels (F12.6).
        Absent `allowed_categories` means no category-level narrowing
        beyond the port list in ConnectionReferenceScope.
      properties:
        allowed_categories:
          type: array
          items:
            type: string
            minLength: 1
      additionalProperties: false

    ConnectionReference:
      type: object
      required:
        - id
        - orgId
        - agentId
        - productId
        - accessGrantId
        - owningPrincipalId
        - state
        - requestedAt
        - expiresAt
        - useCaseCategory
        - purposeElaboration
        - intendedScope
        - requestedDurationDays
        - modifiedByApprover
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productVersionId:
          type: [string, 'null']
          format: uuid
        accessGrantId:
          type: string
          format: uuid
        owningPrincipalId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/ConnectionReferenceState'
        causedBy:
          oneOf:
            - $ref: '#/components/schemas/ConnectionReferenceCause'
            - type: 'null'
        requestedAt:
          type: string
          format: date-time
        approvedAt:
          type: [string, 'null']
          format: date-time
        activatedAt:
          type: [string, 'null']
          format: date-time
        suspendedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: string
          format: date-time
        terminatedAt:
          type: [string, 'null']
          format: date-time
        approvedByPrincipalId:
          type: [string, 'null']
          format: uuid
        governancePolicyVersion:
          type: [string, 'null']
        useCaseCategory:
          type: string
        purposeElaboration:
          type: string
          minLength: 50
        intendedScope:
          $ref: '#/components/schemas/ConnectionReferenceScope'
        dataCategoryConstraints:
          oneOf:
            - $ref: '#/components/schemas/DataCategoryConstraints'
            - type: 'null'
        requestedDurationDays:
          type: integer
          minimum: 1
        approvedScope:
          oneOf:
            - $ref: '#/components/schemas/ConnectionReferenceScope'
            - type: 'null'
        approvedDataCategoryConstraints:
          oneOf:
            - $ref: '#/components/schemas/DataCategoryConstraints'
            - type: 'null'
        approvedDurationDays:
          type: [integer, 'null']
          minimum: 1
        modifiedByApprover:
          type: boolean
        denialReason:
          type: [string, 'null']
        deniedByPrincipalId:
          type: [string, 'null']
          format: uuid
        connectionPackage:
          description: |
            Connection package generated at activation (ADR-008, F12.13).
            Null until the reference transitions to `active`. Retained as
            an immutable audit artifact after the reference terminates —
            consumers check `state` to decide whether the package is usable.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConnectionReferenceList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionReference'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SubmitConnectionReferenceRequest:
      type: object
      required:
        - agentId
        - productId
        - useCaseCategory
        - purposeElaboration
        - intendedScope
        - requestedDurationDays
      properties:
        agentId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        useCaseCategory:
          type: string
          minLength: 1
        purposeElaboration:
          type: string
          minLength: 50
        intendedScope:
          $ref: '#/components/schemas/ConnectionReferenceScope'
        dataCategoryConstraints:
          $ref: '#/components/schemas/DataCategoryConstraints'
        requestedDurationDays:
          type: integer
          minimum: 1

    ApproveConnectionReferenceOptions:
      type: object
      description: |
        All fields are optional. Any field left unset inherits the matching
        value from the original request. The approver may narrow scope,
        duration, or data category constraints but may not broaden them
        (F12.7).
      properties:
        approvedScope:
          $ref: '#/components/schemas/ConnectionReferenceScope'
        approvedDataCategoryConstraints:
          $ref: '#/components/schemas/DataCategoryConstraints'
        approvedDurationDays:
          type: integer
          minimum: 1
        governancePolicyVersion:
          type: string

    DenyConnectionReferenceRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Human-readable reason for denial (immutable).

    RevokeConnectionReferenceRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Human-readable reason for revocation (recorded in the audit log).
