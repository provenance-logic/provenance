name: Seed Verifier

# Closes the verifier half of B-060: every push to main, and every PR that
# touches the migrations or the seed package, runs `pnpm seed:verify:soft-reset`
# against a freshly-migrated Postgres. The original B-060 bug was that the
# softReset SQL drifted out of sync with the schema (column renames silently
# broke the script). This workflow guarantees that drift surfaces on the PR
# that introduces it rather than the next time someone runs a demo.
#
# Full-stack smoke-test integration (the other half of B-060, covering Kong /
# Caddy / agent-query / embedding) is intentionally NOT in this workflow —
# the smoke test needs the whole deployed stack (api + agent-query + Keycloak
# + Neo4j + OpenSearch + embedding + a unified-host Caddy front) and is a
# bigger separate effort. Tracked as B-060 remaining.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/migrations/**'
      - 'packages/seed/**'
      - '.github/workflows/seed-verify.yml'
  workflow_dispatch:

concurrency:
  group: seed-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-soft-reset:
    name: Verify soft reset window
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: provenance
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: provenance_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provenance -d provenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Flyway migrations against CI Postgres
        run: |
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/apps/api/migrations:/flyway/sql:ro" \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5432/provenance \
            -user=provenance \
            -password=provenance_ci_password \
            -connectRetries=10 \
            -locations=filesystem:/flyway/sql \
            migrate

      - name: Insert minimal fixture (org + principal + domain + product)
        env:
          PGPASSWORD: provenance_ci_password
        run: |
          psql -h localhost -U provenance -d provenance -v ON_ERROR_STOP=1 <<'SQL'
            BEGIN;
            INSERT INTO organizations.orgs (id, name, slug)
              VALUES ('11111111-1111-1111-1111-111111111111', 'CI Fixture Org', 'ci-fixture-org')
              ON CONFLICT (slug) DO NOTHING;

            INSERT INTO identity.principals (id, org_id, principal_type, keycloak_subject, email, display_name)
              VALUES (
                '22222222-2222-2222-2222-222222222222',
                '11111111-1111-1111-1111-111111111111',
                'human_user',
                'ci-fixture-subject',
                'ci@fixture.example',
                'CI Fixture'
              )
              ON CONFLICT (keycloak_subject) DO NOTHING;

            INSERT INTO organizations.domains (id, org_id, name, slug, owner_principal_id)
              VALUES (
                '33333333-3333-3333-3333-333333333333',
                '11111111-1111-1111-1111-111111111111',
                'CI Domain',
                'ci-domain',
                '22222222-2222-2222-2222-222222222222'
              )
              ON CONFLICT (org_id, slug) DO NOTHING;

            INSERT INTO products.data_products (id, org_id, domain_id, name, slug, classification, owner_principal_id)
              VALUES (
                '44444444-4444-4444-4444-444444444444',
                '11111111-1111-1111-1111-111111111111',
                '33333333-3333-3333-3333-333333333333',
                'CI Product',
                'ci-product',
                'internal',
                '22222222-2222-2222-2222-222222222222'
              )
              ON CONFLICT (org_id, domain_id, slug) DO NOTHING;
            COMMIT;
          SQL

      - name: Run seed:verify:soft-reset
        env:
          DATABASE_URL: postgres://provenance:provenance_ci_password@localhost:5432/provenance
          # The verifier only touches Postgres directly. SEED_API_KEY and
          # KEYCLOAK_ADMIN_CLIENT_SECRET are required by the Zod schema in
          # packages/seed/src/config.ts but unused for this command path.
          SEED_API_KEY: ci-unused
          KEYCLOAK_ADMIN_CLIENT_SECRET: ci-unused
        run: pnpm --filter @provenance/seed seed:verify:soft-reset
